# Renewable Energy Intelligence Configuration
project:
  name: "Renewable Energy Forecasting & Battery Storage Optimization"
  short_name: "Renewable Energy Intelligence"
  seed: 42

paths:
  raw_data_dir: "/home/asus/Downloads/Renewable Energy Forecasting"
  raw_csv_filename: "time_series_60min_singleindex.csv"
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"

data:
  selected_country: "DK_1"  # Denmark West (DK1 bidding zone)
  country_name: "Denmark (West - DK1)"
  latitude: 56.0            # Approximate latitude for solar geometry
  longitude: 9.0            # Approximate longitude for solar geometry
  timezone: "UTC"
  target_column: "solar_generation_mw"
  
  columns_mapping:
    utc_timestamp: "timestamp"
    DK_1_solar_generation_actual: "solar_generation_mw"
    DK_1_wind_generation_actual: "wind_generation_mw"
    DK_1_load_actual_entsoe_transparency: "load_actual_mw"
    DK_1_load_forecast_entsoe_transparency: "load_forecast_mw"
    DK_1_price_day_ahead: "price_day_ahead_eur_mwh"

splits:
  train_end: "2018-12-31 23:00:00+00:00"
  val_end: "2019-12-31 23:00:00+00:00"
  test_end: "2020-09-30 23:00:00+00:00"

forecasting:
  cutoff_hour: 12           # Day-ahead forecast cutoff at 12:00 UTC for delivery D+1 (hours 24 to 47 ahead)
  horizon_hours: 24
  target: "solar_generation_mw"
  n_splits: 4               # TimeSeriesSplit folds
  random_state: 42
  n_jobs: 2

site:
  peak_load_mw: 5.0
  solar_capacity_mw: 5.0
  grid_import_limit_mw: 6.0
  grid_export_limit_mw: 5.0

tariffs:
  retail_adder_eur_mwh: 20.0  # Network charges, levies, and supplier margin
  export_ratio: 1.0           # Fraction of day-ahead price credited on export
  allow_negative_pricing: false # Do not export at negative prices unless explicitly enabled

battery:
  energy_capacity_mwh: 10.0   # 10 MWh storage capacity
  max_charge_power_mw: 2.5    # 0.25C rate
  max_discharge_power_mw: 2.5
  round_trip_efficiency: 0.88 # 88% RTE
  soc_min: 0.10               # 10% lower buffer
  soc_max: 0.90               # 90% upper buffer
  soc_initial: 0.50           # 50% start
  soc_terminal: 0.50          # 50% target at end of horizon
  degradation_cost_eur_mwh: 0.0 # Configurable battery throughput degradation fee
